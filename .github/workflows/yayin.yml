name: yayin guncelle

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Yayin linklerini cek
        run: |
          pip install -q requests
          python yayin.py --output "$GITHUB_WORKSPACE/yayinlar.m3u" --channels-dir "$GITHUB_WORKSPACE/kanallar" --quiet

      - name: Ciktiları commit et
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add yayinlar.m3u kanallar/
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "yayin guncelleme: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Pages'e yayinla
        uses: actions/configure-pages@v5

      - name: Artifact yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        uses: actions/deploy-pages@v4
